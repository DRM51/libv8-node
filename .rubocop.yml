AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - src/**/*
    - pkg/**/*
    - vendor/**/*
    - test/**/*

Naming/FileName:
  Exclude:
    - lib/libv8-node.rb

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Layout/LineLength:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/SuperWithArgsParentheses:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Style/PerlBackrefs:
  Enabled: false

# rubocop 1.92 (new cop): these files reopen `module Libv8` around their class
Style/OneClassPerFile:
  Enabled: false

# the Vagrantfile aligns its config values in columns
Layout/ExtraSpacing:
  Exclude:
    - Vagrantfile
